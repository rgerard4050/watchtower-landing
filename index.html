<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600;700;800&display=swap');
  :root {
    --black:#060a0d;--dark:#0a1015;--panel:#0e1820;--panel2:#131f28;
    --border:#1a2a38;--border2:#243545;--green:#00ff88;--green-dim:#00cc6a;
    --green-glow:rgba(0,255,136,0.08);--amber:#ffaa00;--blue:#00aaff;
    --text:#c8d8e8;--muted:#4a6a7a;--mono:'Share Tech Mono',monospace;--sans:'Inter',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--black);color:var(--text);font-family:var(--sans);overflow-x:hidden;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:999;}
  nav{position:sticky;top:0;background:rgba(6,10,13,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;z-index:100;}
  .nav-logo{font-family:var(--mono);font-size:13px;color:var(--green);letter-spacing:0.14em;display:flex;align-items:center;gap:8px;}
  .pulse{width:7px;height:7px;background:var(--green);border-radius:50%;animation:blink 2s infinite;flex-shrink:0;}
  @keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,255,136,0.5);}50%{opacity:0.4;box-shadow:0 0 0 5px rgba(0,255,136,0);}}
  .nav-cta{background:var(--green);color:#000;border:none;border-radius:6px;padding:8px 16px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.1em;cursor:pointer;}
  .hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;padding:60px 24px 48px;position:relative;overflow:hidden;}
  .hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,136,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.03) 1px,transparent 1px);background-size:40px 40px;animation:gridmove 20s linear infinite;}
  @keyframes gridmove{0%{background-position:0 0;}100%{background-position:40px 40px;}}
  .hero-glow{position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(0,255,136,0.06) 0%,transparent 70%);top:-50px;right:-80px;pointer-events:none;}
  .hero-content{position:relative;z-index:2;}
  .hero-eyebrow{font-family:var(--mono);font-size:10px;color:var(--green);letter-spacing:0.25em;text-transform:uppercase;margin-bottom:24px;display:flex;align-items:center;gap:10px;}
  .hero-eyebrow::before{content:'';width:24px;height:1px;background:var(--green);}
  h1{font-size:clamp(36px,10vw,56px);font-weight:800;line-height:1.05;color:#fff;letter-spacing:-0.03em;margin-bottom:8px;}
  h1 .accent{color:var(--green);display:block;}
  .hero-sub{font-size:15px;color:var(--muted);font-weight:300;max-width:320px;line-height:1.7;margin:20px 0 36px;}
  .hero-sub strong{color:var(--text);font-weight:500;}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:36px;}
  .hstat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;}
  .hstat-val{font-family:var(--mono);font-size:18px;color:var(--green);display:block;margin-bottom:3px;}
  .hstat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;}
  .ticker{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:28px;overflow:hidden;}
  .ticker-label{font-family:var(--mono);font-size:9px;color:var(--green);letter-spacing:0.15em;flex-shrink:0;}
  .ticker-scroll{flex:1;overflow:hidden;}
  .ticker-inner{display:flex;gap:32px;animation:tickerscroll 18s linear infinite;white-space:nowrap;}
  @keyframes tickerscroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
  .ticker-item{font-family:var(--mono);font-size:11px;color:var(--text);flex-shrink:0;}
  .ticker-item span{color:var(--green);}
  section{padding:56px 24px;border-top:1px solid var(--border);}
  .section-tag{font-family:var(--mono);font-size:9px;color:var(--green);letter-spacing:0.22em;text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
  .section-tag::after{content:'';flex:1;height:1px;background:var(--border);}
  h2{font-size:26px;font-weight:700;color:#fff;letter-spacing:-0.02em;line-height:1.2;margin-bottom:12px;}
  p{font-size:15px;color:var(--muted);font-weight:300;line-height:1.7;margin-bottom:14px;}
  p strong{color:var(--text);font-weight:500;}
  .exp-visual{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin:24px 0;}
  .exp-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.12em;margin-bottom:16px;}
  .exp-bars{display:flex;align-items:flex-end;gap:6px;height:80px;}
  .exp-bar{flex:1;background:linear-gradient(to top,var(--green),rgba(0,255,136,0.2));border-radius:3px 3px 0 0;position:relative;}
  .exp-bar-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8px;color:var(--muted);white-space:nowrap;}
  .exp-note{font-size:11px;color:var(--muted);text-align:center;margin-top:24px;font-style:italic;}
  .flywheel-steps{display:flex;flex-direction:column;gap:0;margin-top:28px;}
  .fw-step{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--border);position:relative;}
  .fw-step:last-child{border-bottom:none;}
  .fw-line{position:absolute;left:19px;top:48px;bottom:-1px;width:2px;background:linear-gradient(to bottom,var(--green),transparent);}
  .fw-step:last-child .fw-line{display:none;}
  .fw-num{width:38px;height:38px;border-radius:50%;border:1px solid var(--green);background:var(--green-glow);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--green);flex-shrink:0;}
  .fw-content h3{font-size:15px;font-weight:600;color:#fff;margin-bottom:4px;}
  .fw-content p{font-size:13px;margin:0;line-height:1.5;}
  .how-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px;}
  .how-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 14px;}
  .how-icon{font-size:22px;margin-bottom:10px;display:block;}
  .how-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:4px;}
  .how-desc{font-size:12px;color:var(--muted);line-height:1.5;margin:0;}
  .driveway-card{background:linear-gradient(135deg,var(--panel) 0%,rgba(0,255,136,0.04) 100%);border:1px solid var(--green);border-radius:12px;padding:24px 20px;margin-top:24px;}
  .driveway-price{font-family:var(--mono);font-size:32px;color:var(--green);margin-bottom:4px;}
  .driveway-price span{font-size:14px;color:var(--muted);}
  .driveway-list{list-style:none;margin:16px 0 20px;display:flex;flex-direction:column;gap:8px;}
  .driveway-list li{font-size:13px;color:var(--text);display:flex;align-items:flex-start;gap:8px;}
  .driveway-list li::before{content:'â–¸';color:var(--green);flex-shrink:0;}
  .wallet-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:24px;}
  .wallet-tabs{display:flex;border-bottom:1px solid var(--border);}
  .wtab{flex:1;padding:14px;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:color 0.15s,background 0.15s;text-transform:uppercase;}
  .wtab.active{color:var(--green);background:var(--green-glow);border-bottom:2px solid var(--green);}
  .tab-panel{display:none;padding:24px 20px;}
  .tab-panel.active{display:block;}
  .field{margin-bottom:16px;}
  label{display:block;font-family:var(--mono);font-size:9px;color:var(--green);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:6px;}
  input,select{width:100%;background:var(--dark);border:1px solid var(--border2);border-radius:8px;padding:13px 14px;color:var(--text);font-family:var(--sans);font-size:16px;outline:none;transition:border-color 0.2s;-webkit-appearance:none;}
  input:focus,select:focus{border-color:var(--green);}
  input::placeholder{color:var(--muted);}
  .input-note{font-size:11px;color:var(--muted);margin-top:5px;}
  .primary-btn{width:100%;background:var(--green);color:#000;border:none;border-radius:8px;padding:16px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;margin-top:6px;transition:background 0.15s,transform 0.1s;}
  .primary-btn:active{transform:scale(0.98);background:var(--green-dim);}
  .secondary-btn{width:100%;background:transparent;border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:14px;font-family:var(--mono);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;margin-top:10px;}
  .wallet-connect-btn{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:16px 14px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color 0.2s;margin-bottom:12px;}
  .wallet-connect-btn:active{border-color:var(--green);}
  .wallet-icon{font-size:24px;flex-shrink:0;}
  .wallet-info{text-align:left;}
  .wallet-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px;}
  .wallet-desc{font-size:11px;color:var(--muted);}
  .wallet-arrow{margin-left:auto;color:var(--muted);font-size:16px;}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
  .divider-line{flex:1;height:1px;background:var(--border);}
  .divider-text{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.12em;}
  .stripe-section{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px;}
  .stripe-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .stripe-lock{color:var(--green);}
  .card-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stripe-badge{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:11px;color:var(--muted);}
  .success-wrap{display:none;text-align:center;padding:32px 20px;}
  .success-wrap.show{display:block;}
  .success-glyph{font-size:44px;margin-bottom:16px;}
  .success-title{font-family:var(--mono);font-size:13px;color:var(--green);letter-spacing:0.1em;margin-bottom:8px;}
  .success-addr{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px;margin:12px 0;}
  .edu-cards{display:flex;flex-direction:column;gap:12px;margin-top:24px;}
  .edu-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:flex-start;}
  .edu-icon{font-size:24px;flex-shrink:0;}
  .edu-tag{font-family:var(--mono);font-size:9px;color:var(--green);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:4px;}
  .edu-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:4px;line-height:1.3;}
  .edu-desc{font-size:12px;color:var(--muted);line-height:1.5;margin:0;}
  .coming-badge{display:inline-block;background:rgba(255,170,0,0.1);border:1px solid rgba(255,170,0,0.3);border-radius:4px;padding:2px 7px;font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:0.1em;margin-left:8px;vertical-align:middle;}
  footer{padding:40px 24px 60px;border-top:1px solid var(--border);text-align:center;}
  .footer-logo{font-family:var(--mono);font-size:13px;color:var(--green);letter-spacing:0.15em;margin-bottom:8px;}
  footer p{font-size:12px;color:var(--muted);margin:0;}
  footer a{color:var(--green);text-decoration:none;}
  .footer-links{display:flex;justify-content:center;gap:20px;margin:16px 0;}
  .footer-links a{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;}

  /* --- mobile readability --- */
  @media (max-width:700px){
    label{font-size:13px !important;letter-spacing:0.06em !important;}
    input,select{font-size:16px !important;padding:15px 14px !important;}
    .primary-btn,.secondary-btn{font-size:15px !important;padding:17px !important;letter-spacing:0.06em !important;}
    .wtab{font-size:13px !important;padding:15px 8px !important;}
    .input-note,.stripe-badge,.wallet-desc,.how-desc,.fw-content p,.driveway-list li{font-size:14px !important;}
    .section-tag,.hero-eyebrow,.divider-text,.exp-label,.stripe-label,.hstat-label,.ticker-label,.ticker-item,.edu-tag{font-size:12px !important;letter-spacing:0.08em !important;}
    .hero-sub,p{font-size:16px !important;line-height:1.6 !important;}
    .success-addr{font-size:13px !important;}
    h2{font-size:24px !important;}
  }
  .pw-wrap{position:relative;}
  .pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--green);font-family:var(--mono);font-size:12px;cursor:pointer;padding:8px;text-transform:uppercase;letter-spacing:0.08em;}
  .login-card{margin-top:22px;padding-top:20px;border-top:1px solid var(--border2);}
