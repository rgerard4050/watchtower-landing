<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Watchtower Terminal v2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="operator-auth.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600;700&display=swap');
:root {
  --black:#080c0f; --dark:#0d1318; --panel:#111820; --panel2:#161f28;
  --border:#1e2d3a; --green:#00ff88; --green-dim:#00cc6a; --green-glow:rgba(0,255,136,0.10);
  --amber:#ffaa00; --amber-dim:#cc8800; --amber-glow:rgba(255,170,0,0.10);
  --red:#ff4455; --red-glow:rgba(255,68,85,0.10);
  --blue:#00aaff; --blue-dim:#0077cc; --blue-glow:rgba(0,170,255,0.10);
  --purple:#aa66ff;
  --text:#c8d8e8; --muted:#5a7a8a;
  --mono:'Share Tech Mono',monospace; --sans:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--black);color:var(--text);font-family:var(--sans);overflow:hidden;}

/* HEADER */
header{background:rgba(8,12,15,0.98);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:100;}
.logo{font-family:var(--mono);font-size:11px;color:var(--green);letter-spacing:0.12em;white-space:nowrap;}
.ticker-bar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 10px;flex:1;min-width:0;overflow:hidden;}
.t-item{display:flex;align-items:center;gap:5px;white-space:nowrap;}
.t-label{font-family:var(--mono);font-size:9px;color:var(--muted);}
.t-price{font-family:var(--mono);font-size:12px;color:var(--green);font-weight:600;}
.t-chg{font-family:var(--mono);font-size:9px;}
.t-chg.up{color:var(--green);} .t-chg.dn{color:var(--red);}
.t-div{width:1px;height:14px;background:var(--border);flex-shrink:0;}
.t-status{font-family:var(--mono);font-size:9px;color:var(--muted);}
.admin-btn{font-family:var(--mono);font-size:9px;color:var(--amber);border:1px solid var(--amber-dim);background:var(--amber-glow);padding:5px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;flex-shrink:0;}

/* TABS */
.tab-nav{display:flex;background:var(--dark);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.tab-nav::-webkit-scrollbar{display:none;}
.tab-btn{font-family:var(--mono);font-size:10px;letter-spacing:0.07em;padding:10px 14px;color:var(--muted);border:none;background:transparent;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s;}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);}
.badge{display:inline-block;font-size:8px;font-family:var(--mono);padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:middle;}
.badge-red{background:var(--red);color:#fff;}
.badge-blue{background:var(--blue);color:#000;}
.badge-amber{background:var(--amber);color:#000;}

/* LAYOUT */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.split-screen { display: grid; grid-template-columns: 40% 60%; flex: 1; overflow: hidden; }
.left-col { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); }
.right-col { position: relative; background: var(--dark); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1; }
.tab-content{flex:1;overflow:hidden;display:none;}
.tab-content.active{display:flex;flex-direction:column;}
.scroll{flex:1;overflow-y:auto;padding:12px;}
.scroll::-webkit-scrollbar{width:3px;}
.scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* SECTION HEADER */
.sh{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border);}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);}
.card-body{padding:10px 12px;}
.card-footer{display:flex;gap:7px;padding:9px 12px;border-top:1px solid var(--border);}

/* MATERIAL GRID */
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px;}
.mat-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s,border-color 0.15s;box-shadow:0 4px 6px rgba(0,0,0,0.15);}
.mat-card:hover{transform:translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,0.3);}
.mat-card:active{transform:scale(0.97);}
.mat-card.selected{border-color:var(--green);background:var(--green-glow);}
.mat-card.cat-copper{border-top:3px solid #b87333;}
.mat-card.cat-aluminum{border-top:3px solid #aac8e0;}
.mat-card.cat-brass{border-top:3px solid #d4aa70;}
.mat-card.cat-steel{border-top:3px solid #8899aa;}
.mat-card.cat-ferrous{border-top:3px solid #cc4444;}
.mat-card.cat-battery{border-top:3px solid var(--amber);}
.mat-card.cat-telecom{border-top:3px solid var(--purple);}
.mat-card.cat-ewaste{border-top:3px solid var(--blue);}
.mat-card.cat-plastic{border-top:3px solid #cc66ff;}
.mat-card.cat-glass{border-top:3px solid #66ddcc;}
.mat-card.cat-bulk{border-top:3px solid #557788;}
.mat-name{font-size:11px;font-weight:600;color:var(--text);margin-bottom:2px;}
.mat-grade{font-size:8px;color:var(--muted);margin-bottom:5px;line-height:1.3;}
.mat-rate{font-family:var(--mono);font-size:11px;color:var(--green);display:flex;justify-content:space-between;align-items:center;}
.mat-unit-label{font-size:8px;color:var(--muted);}

/* FORMS */
.form-row{display:flex;gap:8px;margin-bottom:9px;align-items:flex-end;}
.fg{display:flex;flex-direction:column;gap:4px;flex:1;}
.fl{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:0.08em;}
.fi{background:var(--dark);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 10px;width:100%;outline:none;}
.fi:focus{border-color:var(--green);}
.fs{background:var(--dark);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:11px;padding:8px 10px;width:100%;outline:none;}

/* PAYOUT PREVIEW */
.payout-box{background:var(--dark);border:1px solid var(--green);border-radius:6px;padding:11px 13px;margin-bottom:11px;}
.payout-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.payout-col{text-align:center;}
.payout-val{font-family:var(--mono);font-size:16px;display:block;line-height:1.1;}
.payout-val.green{color:var(--green);}
.payout-val.amber{color:var(--amber);}
.payout-val.blue{color:var(--blue);}
.payout-sub{font-family:var(--mono);font-size:8px;color:var(--muted);margin-top:2px;}
.payout-divider{width:1px;background:var(--border);}
.flag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.flag{font-family:var(--mono);font-size:8px;padding:3px 8px;border-radius:3px;border:1px solid;}
.flag-warn{background:var(--amber-glow);color:var(--amber);border-color:rgba(255,170,0,0.3);}
.flag-ok{background:var(--green-glow);color:var(--green);border-color:rgba(0,255,136,0.3);}
.flag-bad{background:var(--red-glow);color:var(--red);border-color:rgba(255,68,85,0.3);}
.flag-info{background:var(--blue-glow);color:var(--blue);border-color:rgba(0,170,255,0.3);}
.flag-mfg{background:rgba(170,102,255,0.1);color:var(--purple);border-color:rgba(170,102,255,0.3);}

/* BUTTONS */
.btn{font-family:var(--mono);font-size:10px;letter-spacing:0.08em;padding:10px 14px;border-radius:5px;cursor:pointer;border:none;text-transform:uppercase;}
.btn-green{background:var(--green);color:#000;font-weight:700;}
.btn-green:active{opacity:0.8;}
.btn-amber{background:var(--amber);color:#000;font-weight:700;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-approve{flex:1;background:var(--green-glow);color:var(--green);border:1px solid rgba(0,255,136,0.3);font-family:var(--mono);font-size:10px;padding:9px;border-radius:5px;cursor:pointer;text-transform:uppercase;letter-spacing:0.07em;}
.btn-reject{flex:1;background:var(--red-glow);color:var(--red);border:1px solid rgba(255,68,85,0.25);font-family:var(--mono);font-size:10px;padding:9px;border-radius:5px;cursor:pointer;text-transform:uppercase;letter-spacing:0.07em;}
.btn-blue{flex:1;background:var(--blue-glow);color:var(--blue);border:1px solid rgba(0,170,255,0.3);font-family:var(--mono);font-size:10px;padding:9px;border-radius:5px;cursor:pointer;text-transform:uppercase;letter-spacing:0.07em;}
.btn-full{width:100%;}

/* STATUS PILLS */
.pill{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:3px;}
.pill-pending{background:var(--amber-glow);color:var(--amber);border:1px solid rgba(255,170,0,0.3);}
.pill-approved{background:var(--green-glow);color:var(--green);border:1px solid rgba(0,255,136,0.3);}
.pill-rejected{background:var(--red-glow);color:var(--red);border:1px solid rgba(255,68,85,0.3);}
.pill-transit{background:var(--blue-glow);color:var(--blue);border:1px solid rgba(0,170,255,0.3);}
.pill-mfg{background:rgba(170,102,255,0.1);color:var(--purple);border:1px solid rgba(170,102,255,0.3);}
.pill-spv{background:rgba(255,215,0,0.1);color:#ffd700;border:1px solid rgba(255,215,0,0.3);}

/* QUEUE ROWS & KANBAN */
#queueList { display: flex; gap: 10px; overflow-x: auto; align-items: flex-start; padding-bottom: 10px; }
#queueList::-webkit-scrollbar { height: 4px; }
#queueList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.kanban-col { flex: 0 0 280px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; max-height: calc(100vh - 180px); }
.kanban-col-header { padding: 10px 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); letter-spacing: 0.1em; background: rgba(0,0,0,0.2); border-radius: 8px 8px 0 0; }
.kanban-col-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.q-id{font-family:var(--mono);font-size:10px;color:var(--green);}
.q-time{font-family:var(--mono);font-size:9px;color:var(--muted);}
.q-row{display:flex;justify-content:space-between;margin-bottom:4px;}
.q-key{font-size:10px;color:var(--muted);}
.q-val{font-family:var(--mono);font-size:10px;color:var(--text);}
.q-val.g{color:var(--green);} .q-val.a{color:var(--amber);} .q-val.b{color:var(--blue);} .q-val.p{color:var(--purple);}
/* ALERTS */
.alert-bar{background:var(--amber-glow);color:var(--amber);border-bottom:1px solid rgba(255,170,0,0.3);padding:10px 12px;font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-align:center;}

/* NODE SIGNAL */
.node-signal{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.node-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.node-dot.active{background:var(--green);animation:pulse 2s infinite;}
.node-dot.full{background:var(--amber);animation:pulse 1s infinite;}
.node-dot.alert{background:var(--red);animation:pulse 0.5s infinite;}
.node-dot.offline{background:var(--muted);}
.node-info{flex:1;}
.node-id{font-family:var(--mono);font-size:11px;color:var(--text);font-weight:600;}
.node-meta{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;}
.node-fill{font-family:var(--mono);font-size:11px;color:var(--amber);}

/* LEDGER */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:9px 11px;text-align:center;}
.stat-val{font-family:var(--mono);font-size:15px;color:var(--green);display:block;}
.stat-lbl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;}
.ledger-tbl{width:100%;border-collapse:collapse;font-size:10px;}
.ledger-tbl th{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:0.07em;padding:5px 7px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
.ledger-tbl td{font-family:var(--mono);font-size:9px;padding:7px 7px;border-bottom:1px solid rgba(30,45,58,0.4);}
.ledger-tbl td.g{color:var(--green);} .ledger-tbl td.a{color:var(--amber);} .ledger-tbl td.m{color:var(--muted);}
@keyframes rowFadeIn {
  from { opacity: 0; transform: translateY(-5px); background-color: rgba(0, 255, 136, 0.1); }
  to { opacity: 1; transform: translateY(0); background-color: transparent; }
}
.ledger-tbl tbody tr { animation: rowFadeIn 0.4s ease-out forwards; }

/* CASHIER */
.cashier-calc{background:var(--dark);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:11px;}
.cc-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}
.cc-key{font-size:10px;color:var(--muted);}
.cc-val{font-family:var(--mono);font-size:11px;color:var(--text);}
.cc-total{font-family:var(--mono);font-size:20px;color:var(--amber);}
.cc-div{height:1px;background:var(--border);margin:7px 0;}

/* ADMIN MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:500;overflow-y:auto;align-items:flex-start;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--dark);border:1px solid var(--border);border-radius:10px;width:min(540px,96vw);padding:18px;margin:auto;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-title{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:0.1em;}
.modal-close{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:55vh;overflow-y:auto;}
.price-item{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:9px;}
.price-name{font-size:9px;color:var(--text);margin-bottom:5px;font-weight:600;line-height:1.3;}
.price-row{display:flex;align-items:center;gap:4px;}
.price-inp{background:var(--dark);border:1px solid var(--border);border-radius:3px;color:var(--green);font-family:var(--mono);font-size:12px;padding:5px 7px;width:75px;outline:none;text-align:right;}
.price-inp:focus{border-color:var(--amber);}
.price-u{font-family:var(--mono);font-size:8px;color:var(--muted);}
