<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Watchtower — Marketplace</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap');
        :root {
            --black: #080c0f; --dark: #0d1318; --panel: #111820; --panel2: #161f28;
            --border: #1e2d3a; --green: #00ff88; --green-dim: #00cc6a; --amber: #ffaa00;
            --blue: #00aaff; --red: #ff4455; --muted: #5a7a8a; --text: #c8d8e8; --sans: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin:0; padding:0 0 40px; background:var(--black); color:#fff; font-family:var(--sans); min-height:100vh; }
        .terminal-header {
            width:100%; padding:14px 18px; background:var(--dark); border-bottom:1px solid var(--border);
            text-align:center; color:var(--green); text-shadow:0 0 5px var(--green-dim); letter-spacing:2px;
            font-size:13px; display:flex; align-items:center; justify-content:space-between;
            font-family:'Share Tech Mono', monospace; position:sticky; top:0; z-index:10;
        }
        .terminal-header a { color:var(--muted); text-decoration:none; font-size:11px; }
        .wrap { max-width:900px; margin:0 auto; padding:18px 16px; }
        .friendly-sub { font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:16px; }
        .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:20px; }
        .filters label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; display:block; margin-bottom:4px; }
        .filters input {
            width:100%; background:var(--panel2); border:1px solid var(--border); color:#fff; padding:9px 10px;
            border-radius:6px; font-family:var(--sans); font-size:13px;
        }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
        .card {
            background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px;
            text-decoration:none; color:inherit; display:block; transition:border-color .15s;
        }
        .card:hover { border-color:var(--green); }
        .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
        .card-title { font-size:15px; font-weight:600; color:#fff; }
        .card-value { font-family:'Share Tech Mono', monospace; font-size:16px; color:var(--green); white-space:nowrap; }
        .card-sub { font-size:12px; color:var(--muted); margin-bottom:6px; line-height:1.5; }
        .verified-badge {
            display:inline-block; font-family:'Share Tech Mono', monospace; font-size:10px; letter-spacing:.08em;
            color:var(--black); background:var(--green); padding:3px 8px; border-radius:999px; margin-top:6px;
        }
        .empty { font-size:13px; color:var(--muted); font-style:italic; padding:20px 0; text-align:center; }
    </style>
</head>
<body>

    <div class="terminal-header">
        <span>WATCHTOWER // MARKETPLACE</span>
        <a href="index.html">&#8592; HOME</a>
    </div>

    <div class="wrap">
        <p class="friendly-sub">Verified recovered material, open for offer. Every listing here has passed intake verification and has a linked material passport — no unverified inventory appears on this page.</p>

        <div class="filters">
            <div>
                <label for="fMaterial">Material</label>
                <input type="text" id="fMaterial" placeholder="e.g. Copper">
            </div>
            <div>
                <label for="fRegion">Location</label>
                <input type="text" id="fRegion" placeholder="e.g. Ocala">
            </div>
            <div>
                <label for="fMinWeight">Min Quantity (lb)</label>
                <input type="number" id="fMinWeight" min="0">
            </div>
            <div>
                <label for="fMaxWeight">Max Quantity (lb)</label>
                <input type="number" id="fMaxWeight" min="0">
            </div>
        </div>

        <div id="listingsGrid" class="grid">
            <div class="empty">Loading listings…</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL  = "https://eypovuxuddiqgncjdpkq.supabase.co";
        const SUPABASE_ANON = "sb_publishable_ZlykauNc-3YY80w6nxzsKw_Z2lgAgU1";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        const grid = document.getElementById('listingsGrid');
        let allListings = [];

        function fmtMoney(n) { return n == null ? 'Contact for price' : '$' + n; }

        function applyFilters() {
            const material = document.getElementById('fMaterial').value.trim().toLowerCase();
            const region = document.getElementById('fRegion').value.trim().toLowerCase();
            const minW = parseFloat(document.getElementById('fMinWeight').value);
            const maxW = parseFloat(document.getElementById('fMaxWeight').value);

            const filtered = allListings.filter((l) => {
                if (material && !(l.material_type || '').toLowerCase().includes(material)) return false;
                if (region && !(l.location_region || '').toLowerCase().includes(region)) return false;
                if (!isNaN(minW) && Number(l.available_weight) < minW) return false;
                if (!isNaN(maxW) && Number(l.available_weight) > maxW) return false;
                return true;
            });
            renderGrid(filtered);
        }

        function renderGrid(rows) {
            if (!rows.length) {
                grid.innerHTML = '<div class="empty">No listings match right now. Check back soon — new verified material is added as it clears intake.</div>';
                return;
            }
            grid.innerHTML = rows.map((l) => `
                <a class="card" href="marketplace-listing.html?id=${l.listing_id}">
                    <div class="card-top">
                        <div class="card-title">${l.material_type || 'Recovered material'}${l.grade ? ' · ' + l.grade : ''}</div>
                        <div class="card-value">${fmtMoney(l.asking_price)}</div>
                    </div>
                    <div class="card-sub">${l.available_weight} lb available</div>
                    <div class="card-sub">${l.location_region || 'Location on request'}</div>
                    ${l.is_verified ? '<span class="verified-badge">✓ VERIFIED</span>' : ''}
                </a>
            `).join('');
        }

        async function loadListings() {
            const { data, error } = await sb.from('vw_marketplace_public').select('*').order('created_at', { ascending: false });
            if (error) {
                grid.innerHTML = `<div class="empty">Could not load listings: ${error.message}</div>`;
                return;
            }
            allListings = data || [];
            renderGrid(allListings);
        }

        ['fMaterial', 'fRegion', 'fMinWeight', 'fMaxWeight'].forEach((id) => {
            document.getElementById(id).addEventListener('input', applyFilters);
        });

        loadListings();
        setInterval(loadListings, 30000);
    </script>
</body>
</html>
