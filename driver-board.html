<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Watchtower — Driver Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --black: #080c0f;
            --dark: #0d1318;
            --panel: #111820;
            --panel2: #161f28;
            --border: #1e2d3a;
            --green: #00ff88;
            --green-dim: #00cc6a;
            --green-glow: rgba(0,255,136,0.10);
            --amber: #ffaa00;
            --blue: #00aaff;
            --red: #ff4455;
            --muted: #5a7a8a;
            --text: #c8d8e8;
            --sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0 0 40px;
            background-color: var(--black);
            color: #fff;
            font-family: var(--sans);
            min-height: 100vh;
        }

        .terminal-header {
            width: 100%; padding: 14px 18px; background: var(--dark);
            border-bottom: 1px solid var(--border); text-align: center;
            color: var(--green); text-shadow: 0 0 5px var(--green-dim);
            letter-spacing: 2px; font-size: 13px; display:flex; align-items:center; justify-content:space-between;
            font-family: 'Share Tech Mono', monospace; position: sticky; top: 0; z-index: 10;
        }
        .terminal-header a { color: var(--muted); text-decoration:none; font-size:11px; }

        .wrap { max-width: 520px; margin: 0 auto; padding: 18px 16px; }

        .friendly-sub { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }

        .sh {
            font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--green);
            letter-spacing: .12em; text-transform: uppercase; margin: 22px 0 10px;
        }
        .sh:first-of-type { margin-top: 0; }

        .card {
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 14px; margin-bottom: 10px;
        }
        .card.mine { border-color: var(--blue); }
        .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom: 8px; }
        .card-title { font-size: 15px; font-weight: 600; color: #fff; }
        .card-value { font-family: 'Share Tech Mono', monospace; font-size: 16px; color: var(--green); white-space: nowrap; }
        .card-sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
        .card-photo { width: 100%; border-radius: 8px; margin-bottom: 10px; display:block; }

        .btn {
            width: 100%; background: var(--panel2); border: 1px solid var(--green); color: var(--green);
            padding: 12px; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px; border-radius: 6px;
        }
        .btn:active { background: var(--green); color: var(--black); }
        .btn[disabled] { opacity: .5; pointer-events: none; }
        .btn.complete { border-color: var(--blue); color: var(--blue); }
        .btn.complete:active { background: var(--blue); color: var(--black); }
        .btn.nav { border-color: var(--border); color: var(--muted); margin-top: 8px; }

        .empty { font-size: 13px; color: var(--muted); font-style: italic; padding: 6px 0 16px; }

        .toast {
            position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
            background: var(--panel); border: 1px solid var(--green); color: var(--text);
            padding: 12px 18px; border-radius: 8px; font-size: 13px; max-width: 90%;
            display: none; z-index: 100; text-align: center;
        }
        .toast.err { border-color: var(--red); }
        .toast.show { display: block; }

        #stateScreen { display:none; text-align:center; margin-top: 30px; }
        #stateScreen p { font-size: 14px; color: var(--text); line-height: 1.6; }
        #stateScreen a { color: var(--green); }
    </style>
</head>
<body>

    <div class="terminal-header">
        <span>WATCHTOWER // DRIVER BOARD</span>
        <a href="index.html">&#8592; HOME</a>
    </div>

    <div class="wrap" id="board" style="display:none">
        <p class="friendly-sub">Claiming, status updates, scanning, and passport creation all happen in one place now.</p>

        <div class="sh">Pickup Workflow</div>
        <div id="jobLinkCard" class="card"></div>

        <div class="sh">Payouts</div>
        <div id="connectStatus" class="card"></div>
        <div id="payoutList"></div>
    </div>

    <div class="wrap" id="stateScreen">
        <p id="stateText"></p>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const SUPABASE_URL  = "https://eypovuxuddiqgncjdpkq.supabase.co";
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cG92dXh1ZGRpcWduY2pkcGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MzU1NDgsImV4cCI6MjA5ODUxMTU0OH0.JLSmCx7bZe7yIxxdXZwCWrLeyV1zAoPTXbSP24IckBY";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        let currentUserId = null;
        let currentAccessToken = null;
        const board = document.getElementById('board');
        const connectStatus = document.getElementById('connectStatus');
        const payoutList = document.getElementById('payoutList');
        const stateScreen = document.getElementById('stateScreen');
        const stateText = document.getElementById('stateText');
        const jobLinkCard = document.getElementById('jobLinkCard');

        function showToast(msg, isErr) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isErr ? ' err' : '');
            setTimeout(() => { t.className = 'toast'; }, 4000);
        }

        function showDeadEnd(text) {
            board.style.display = 'none';
            stateText.innerHTML = text;
            stateScreen.style.display = 'block';
        }

        function fmtMoney(n) {
            return n == null ? '—' : '$' + n;
        }

        // Claiming, status transitions, scanning, intake, and passport
        // creation all live in job.html now (Phase 3 consolidation) --
        // this is a read-only summary + a link in, not a second
        // implementation of any of that.
        async function loadJobLink() {
            const { data: activeJob } = await sb.from('jobs')
                .select('id, status')
                .eq('driver_id', currentUserId)
                .not('status', 'in', '(COMPLETED,CANCELLED)')
                .order('created_at', { ascending: false })
                .limit(1)
                .maybeSingle();

            if (activeJob) {
                jobLinkCard.innerHTML = `
                    <div class="card-sub" style="margin-bottom:10px">You have a job in progress — status: ${activeJob.status}.</div>
                    <a class="btn" style="display:block;text-align:center;text-decoration:none" href="job.html?job=${activeJob.id}">CONTINUE JOB</a>
                `;
                return;
            }

            const { count } = await sb.from('scans').select('id', { count: 'exact', head: true }).eq('bounty_status', 'open');
            jobLinkCard.innerHTML = `
                <div class="card-sub" style="margin-bottom:10px">${count || 0} open bount${count === 1 ? 'y' : 'ies'} right now.</div>
                <a class="btn" style="display:block;text-align:center;text-decoration:none" href="job.html">OPEN JOB BOARD</a>
            `;
        }

        async function startConnectOnboarding() {
            const btn = document.getElementById('setupPayoutsBtn');
            if (btn) { btn.disabled = true; btn.textContent = 'LOADING…'; }
            try {
                const res = await fetch('/api/driver-connect-onboarding', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ access_token: currentAccessToken }),
                });
                const json = await res.json();
                if (!res.ok) throw new Error(json.error || 'Could not start onboarding.');
                window.location.href = json.url;
            } catch (err) {
                showToast('Payout setup failed: ' + err.message, true);
                if (btn) { btn.disabled = false; btn.textContent = 'SET UP PAYOUTS'; }
            }
        }

        async function loadConnectStatus() {
            const { data: driverRow } = await sb.from('drivers')
                .select('stripe_payouts_enabled')
                .eq('user_id', currentUserId)
                .maybeSingle();

            if (driverRow && driverRow.stripe_payouts_enabled) {
                connectStatus.innerHTML = '<div class="card-sub" style="margin:0;color:var(--green)">✓ Payouts are set up. Completed bounties will be paid out here.</div>';
            } else {
                connectStatus.innerHTML = `
                    <div class="card-sub" style="margin-bottom:10px">Set up Stripe payouts to get paid for completed bounties.</div>
                    <button class="btn" id="setupPayoutsBtn">SET UP PAYOUTS</button>
                `;
                document.getElementById('setupPayoutsBtn').addEventListener('click', startConnectOnboarding);
            }
        }

        async function loadPayoutHistory() {
            const { data, error } = await sb.from('scans')
                .select('id, summary, driver_payout_cents, driver_transfer_id, completed_at')
                .eq('claimed_by', currentUserId)
                .eq('bounty_status', 'completed')
                .not('driver_payout_cents', 'is', null)
                .order('completed_at', { ascending: false });

            if (error || !data || !data.length) {
                payoutList.innerHTML = '<div class="empty">No payouts yet.</div>';
                return;
            }

            payoutList.innerHTML = data.map((r) => `
                <div class="card">
                    <div class="card-top">
                        <div class="card-title">${r.summary || 'Recyclable material scan'}</div>
                        <div class="card-value">${fmtMoney((r.driver_payout_cents / 100).toFixed(2))}</div>
                    </div>
                    <div class="card-sub" style="margin:0">${r.driver_transfer_id ? 'Paid ✓' : 'Pending — awaiting operator payout'}</div>
                </div>
            `).join('');
        }

        async function handleConnectReturnIfPresent() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('connect') !== 'return') return;

            history.replaceState(null, '', window.location.pathname);
            try {
                const res = await fetch('/api/driver-connect-return', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ access_token: currentAccessToken }),
                });
                const json = await res.json();
                if (!res.ok) throw new Error(json.error || 'Could not confirm payout setup.');
                showToast(json.payouts_enabled ? 'Payouts are set up ✓' : 'Almost there — Stripe still needs more info from you.');
            } catch (err) {
                showToast('Could not confirm payout setup: ' + err.message, true);
            }
        }

        (async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                const next = encodeURIComponent(window.location.href);
                showDeadEnd(`You need to be signed in to see the driver board. <a href="index.html?next=${next}">Log in</a>, then you'll land back here.`);
                return;
            }
            currentUserId = session.user.id;
            currentAccessToken = session.access_token;
            board.style.display = 'block';
            await handleConnectReturnIfPresent();
            await Promise.all([loadJobLink(), loadConnectStatus(), loadPayoutHistory()]);
            setInterval(() => { loadJobLink(); loadPayoutHistory(); }, 15000);
        })();
    </script>
</body>
</html>
